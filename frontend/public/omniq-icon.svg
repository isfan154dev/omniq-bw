<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Dark background fill -->
  <polygon points="32,3 59,18.5 59,45.5 32,61 5,45.5 5,18.5" fill="#050508"/>
  <!-- Cyan hexagon border -->
  <polygon points="32,3 59,18.5 59,45.5 32,61 5,45.5 5,18.5" fill="none" stroke="#00d4ff" stroke-width="2.5" filter="url(#glow)"/>
  <!-- Inner thin hexagon -->
  <polygon points="32,10 53,22 53,42 32,54 11,42 11,22" fill="none" stroke="#00d4ff" stroke-width="0.75" opacity="0.35"/>
  <!-- OQ text -->
  <text x="32" y="39" text-anchor="middle" font-family="monospace,sans-serif" font-size="17" font-weight="900" fill="#00d4ff" letter-spacing="1.5" filter="url(#glow)">OQ</text>
</svg>
